<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="Vista previa del proyecto pendiente">
  <!--
    Marcador de posicion para proyectos sin captura todavia.
    Sustituye a placehold.co: misma proporcion 800x500, paleta del proyecto y
    cero peticiones a terceros.
  -->
  <defs>
    <pattern id="rejilla" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <radialGradient id="halo" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="#17191d"/>
  <rect width="800" height="500" fill="url(#rejilla)"/>
  <rect width="800" height="500" fill="url(#halo)"/>

  <!-- Marco: mismo filete que las tarjetas -->
  <rect x="0.5" y="0.5" width="799" height="499" fill="none" stroke="#ffffff" stroke-opacity="0.20" stroke-width="1"/>

  <!-- Marca de encuadre de imagen -->
  <g stroke="#60a5fa" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M330 214 h-18 v18"/>
    <path d="M470 214 h18 v18"/>
    <path d="M330 286 h-18 v-18"/>
    <path d="M470 286 h18 v-18"/>
  </g>
  <circle cx="400" cy="250" r="16" fill="none" stroke="#60a5fa" stroke-width="3"/>

  <text x="400" y="330" text-anchor="middle" fill="#9aa0a6"
        font-family="Consolas, ui-monospace, monospace" font-size="20" letter-spacing="3">VISTA PREVIA PENDIENTE</text>
</svg>
