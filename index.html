    <!--
      Color de la barra del navegador en movil. Arranca en la base oscura; el
      hook useTheme reescribe este mismo meta al cambiar de tema.
    -->
    <meta name="theme-color" content="#0b0c0d" />

    <!--
      Pinta el fondo antes de que cargue el bundle. Sin esto el documento se
      queda blanco hasta que React monta, lo que produce un fogonazo al entrar
      en tema oscuro.

      Replica readTheme() de src/hooks/useTheme.ts: si cambian la clave de
      almacenamiento, la regla de respaldo o estos dos colores, hay que
      cambiarlos alli tambien.
    -->
    <script>
      (function () {
        var stored = null;
        // Solo la lectura va protegida: en modo privado localStorage lanza, y
        // el pintado tiene que ocurrir igual o vuelve el parpadeo.
        try {
          stored = localStorage.getItem("theme");
        } catch (e) {}
        var dark =
          stored === "dark" || stored === "light"
            ? stored === "dark"
            : !window.matchMedia("(prefers-color-scheme: light)").matches;
        var root = document.documentElement;
        if (!dark) root.classList.add("light");
        root.style.backgroundColor = dark ? "#0b0c0d" : "#f2f0e9";
        root.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
